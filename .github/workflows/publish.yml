name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建、检查和打包，不上传到 npm'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'WiseWong6/wise-motion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: 获取源码和版本标签
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 核对发布版本和来源
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/main

      - name: 准备 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: 使用已验证的 npm 客户端
        run: npm install --global npm@11.17.0

      - name: 准备字体检查环境
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: 安装字体检查依赖
        run: python -m pip install 'fonttools==4.64.0' 'brotli==1.2.0'

      - name: 安装项目依赖
        run: npm ci

      - name: 构建组件和素材清单
        run: npm run build

      - name: 运行公开仓库可独立完成的检查
        run: npm run test:ci

      - name: 打包并试运行发布
        id: package
        shell: bash
        run: |
          package_file=$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")
          package_path="$RUNNER_TEMP/$package_file"
          npm run publish:package -- "$package_path" --dry-run
          echo "file=$package_path" >> "$GITHUB_OUTPUT"

      - name: 通过 npm 可信发布上传同一份包
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: npm run publish:package -- "$PACKAGE_FILE"
